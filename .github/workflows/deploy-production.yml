name: Production CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: >-
      vars.PRODUCTION_CD_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          required_values=(
            GCP_PROJECT_ID
            GCP_REGION
            ARTIFACT_REGISTRY_REPOSITORY
            CLOUD_RUN_SERVICE
            NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
          )
          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "production Environmentの${name}が未設定です" >&2
              exit 1
            fi
          done
          if [[ "${GCP_REGION}" != "asia-northeast1" ]]; then
            echo "GCP_REGIONはasia-northeast1である必要があります" >&2
            exit 1
          fi

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build the production image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/web:${DEPLOY_SHA}"
          docker build \
            --build-arg "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --build-arg "NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=true" \
            --tag "${image_tag}" \
            .
          echo "IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"

      - name: Push the production image
        run: docker push "${IMAGE_TAG}"

      - name: Resolve the immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest="$(gcloud artifacts docker images describe "${IMAGE_TAG}" --format='value(image_summary.digest)')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact Registryから有効なdigestを取得できませんでした" >&2
            exit 1
          fi
          image_with_digest="${IMAGE_TAG%:*}@${digest}"
          echo "IMAGE_WITH_DIGEST=${image_with_digest}" >> "${GITHUB_ENV}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy only the image to Cloud Run
        run: >-
          gcloud run deploy "${CLOUD_RUN_SERVICE}"
          --project="${GCP_PROJECT_ID}"
          --region="${GCP_REGION}"
          --image="${IMAGE_WITH_DIGEST}"
          --quiet

      - name: Verify the deployed digest
        shell: bash
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(spec.template.spec.containers[0].image)')"
          if [[ "${deployed_image}" != "${IMAGE_WITH_DIGEST}" ]]; then
            echo "Cloud Runのimageが期待するdigestと一致しません" >&2
            exit 1
          fi

      - name: Smoke test the HTTPS endpoint
        shell: bash
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          if [[ ! "${service_url}" =~ ^https:// ]]; then
            echo "Cloud RunのHTTPS URLを取得できませんでした" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 30 \
            "${service_url}/login" \
            --output /dev/null
