name: Production CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # 前回のdeploy以降の変更がドキュメントのみの場合、deployをskipする(INF-017)。
  # このjobは過去のdeploy実績の照会と差分判定だけを行い、GCPの資格情報を持たない。
  changes:
    name: Detect app changes since last deploy
    if: >-
      vars.PRODUCTION_CD_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # 過去のworkflow runとjobの結果を照会するために必要
      actions: read
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # 前回deploy commitとの比較に全historyが必要
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the last deployed commit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 手動実行はskip判定を行わず必ずdeployする。
          # docsのみの状態でも強制的にdeployし直せる逃げ道として残す。
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "手動実行のため判定せずdeployします"
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # 差分の基準は「Build and deploy jobが実際に成功した(=本当にdeployした)直近runのcommit」。
          # deployをskipしただけの成功runを基準にすると、CD無効期間やCIの
          # cancel-in-progressで未deployのコード変更が取り残されるため、含めない。
          last_deployed=""
          runs="$(gh api \
            "repos/${REPOSITORY}/actions/workflows/deploy-production.yml/runs?branch=main&status=success&per_page=15" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' 2>/dev/null || true)"
          while read -r run_id head_sha; do
            [[ -n "${run_id}" ]] || continue
            deployed="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '[.jobs[] | select(.name == "Build and deploy" and .conclusion == "success")] | length' \
              2>/dev/null || echo 0)"
            if [[ "${deployed}" -ge 1 ]]; then
              last_deployed="${head_sha}"
              break
            fi
          done <<< "${runs}"

          # 既定はdeployする。基準commitを特定できない場合(初回deployやAPI失敗)も
          # 安全側に倒してdeployする(fail open)。
          deploy=true
          if [[ -n "${last_deployed}" ]] && git cat-file -e "${last_deployed}" 2>/dev/null; then
            if ./scripts/docs-only-diff.sh "${last_deployed}" "${DEPLOY_SHA}"; then
              # 前回deploy以降の変更がドキュメントのみのため、deployをskipする
              deploy=false
            fi
          fi

          echo "判定結果: deploy=${deploy} (前回deploy=${last_deployed:-特定できず})"
          echo "deploy=${deploy}" >> "${GITHUB_OUTPUT}"

  # 未適用のmigrationをdeployより前に本番DBへ適用する(INF-022〜INF-026)。
  # このjobだけが本番DB接続文字列を参照し、GCPの資格情報を持たない。
  # 許可Googleアカウント一覧の同期は行わない(INF-024)。
  migrate:
    # このjob名は構造testと運用資料が参照するため変更しない
    name: Apply migrations
    needs: changes
    # 自動適用はvariableで明示的に有効化した場合だけ行う。無効時は従来どおり手動適用とする
    if: needs.changes.outputs.deploy == 'true' && vars.PRODUCTION_MIGRATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Apply pending migrations
        shell: bash
        env:
          # Supabase Session poolerのURI。GitHub hosted runnerはIPv6の直接接続ができない
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "production EnvironmentのPRODUCTION_DATABASE_URLが未設定です" >&2
            exit 1
          fi
          # 接続文字列はcommand lineへ展開せず、変数名だけでcontainerへ渡す
          docker run --rm \
            --env DATABASE_URL \
            --env MIGRATION_MODE=production \
            --env MIGRATIONS_DIR=/migrations \
            --volume "${GITHUB_WORKSPACE}/supabase/migrations:/migrations:ro" \
            --volume "${GITHUB_WORKSPACE}/scripts/apply-migrations.sh:/app/apply-migrations.sh:ro" \
            --entrypoint /bin/sh \
            postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929 \
            /app/apply-migrations.sh

  deploy:
    # このjob名はchanges jobの照会条件と構造testが参照するため変更しない
    name: Build and deploy
    needs: [changes, migrate]
    # 前回deploy以降がドキュメントのみの変更ならskipする(判定はchanges jobを参照)。
    # migrationの適用が失敗・cancelされた場合はdeployせず、自動適用が無効(skipped)なら従来どおりdeployする
    if: >-
      !cancelled() &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      # Workload Identity FederationのOIDC token発行に必要
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          required_values=(
            GCP_PROJECT_ID
            GCP_REGION
            ARTIFACT_REGISTRY_REPOSITORY
            CLOUD_RUN_SERVICE
            NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
          )
          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "production Environmentの${name}が未設定です" >&2
              exit 1
            fi
          done
          if [[ "${GCP_REGION}" != "asia-northeast1" ]]; then
            echo "GCP_REGIONはasia-northeast1である必要があります" >&2
            exit 1
          fi

      - name: Checkout the verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build the production image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/web:${DEPLOY_SHA}"
          docker build \
            --build-arg "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --build-arg "NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=true" \
            --tag "${image_tag}" \
            .
          echo "IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"

      - name: Push the production image
        run: docker push "${IMAGE_TAG}"

      - name: Resolve the immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest="$(gcloud artifacts docker images describe "${IMAGE_TAG}" --format='value(image_summary.digest)')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact Registryから有効なdigestを取得できませんでした" >&2
            exit 1
          fi
          image_with_digest="${IMAGE_TAG%:*}@${digest}"
          echo "IMAGE_WITH_DIGEST=${image_with_digest}" >> "${GITHUB_ENV}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy only the image to Cloud Run
        run: >-
          gcloud run deploy "${CLOUD_RUN_SERVICE}"
          --project="${GCP_PROJECT_ID}"
          --region="${GCP_REGION}"
          --image="${IMAGE_WITH_DIGEST}"
          --quiet

      - name: Verify the deployed digest
        shell: bash
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(spec.template.spec.containers[0].image)')"
          if [[ "${deployed_image}" != "${IMAGE_WITH_DIGEST}" ]]; then
            echo "Cloud Runのimageが期待するdigestと一致しません" >&2
            exit 1
          fi

      - name: Smoke test the HTTPS endpoint
        shell: bash
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          if [[ ! "${service_url}" =~ ^https:// ]]; then
            echo "Cloud RunのHTTPS URLを取得できませんでした" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 30 \
            "${service_url}/login" \
            --output /dev/null
